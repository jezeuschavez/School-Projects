# Fly.io config. Change `app` to a unique name before `fly launch` / `fly deploy`.
app = "slug-macros-change-me"
primary_region = "sjc"   # San Jose, closest to Santa Cruz

[env]
  DATA_DIR = "/data"
  PLAN_HOUR = "20"        # 8 PM Pacific

[[mounts]]
  source = "slug_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine running so the 8 PM job fires.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
